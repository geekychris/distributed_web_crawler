services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "22092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Container listener (used by other services in the compose network) is
      # kafka:29092; host listener (from your Mac) is localhost:22092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:22092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # Broker listens on 29092 (container listener) and 22092 (host
      # listener) — no plain 9092 binding. Use the host listener port
      # for the intra-container healthcheck.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:22092"]
      interval: 10s
      timeout: 5s
      retries: 30

  cassandra:
    image: cassandra:4.1.3
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=crawler_cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - ./src/main/resources/schema.cql:/init/schema.cql
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # MinIO ships `mc` but not curl/wget. `mc ready local` hits the same
      # /minio/health/ready endpoint under the hood.
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null 2>&1 && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Belt-and-braces bucket bootstrap. The app also self-creates it on startup
  # via BucketBootstrap, but this makes cold-start faster and keeps parity
  # with the k8s minio-create-bucket Job.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set myminio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing myminio/crawler-bucket

  crawler:
    build: .
    ports:
      - "28080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: crawler-group-1
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      CASSANDRA_KEYSPACE: crawler
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crawler-bucket
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # Use the Redis-backed trust store by default so we exercise the
      # low-latency KV path. Set TRUSTED_HOSTS_BACKEND=cassandra to fall
      # back to the Cassandra table.
      TRUSTED_HOSTS_BACKEND: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

volumes:
  cassandra_data:
  minio_data:
  redis_data:
