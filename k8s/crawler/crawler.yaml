apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler
  namespace: crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler
  template:
    metadata:
      labels:
        app: crawler
    spec:
      # Wait for the infra services to be reachable before booting Spring.
      # Prevents a CrashLoopBackOff race on cold-cluster boot.
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z kafka.crawler.svc.cluster.local 9092; do
            echo "waiting for kafka…"; sleep 3
          done
      - name: wait-for-cassandra
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z cassandra.crawler.svc.cluster.local 9042; do
            echo "waiting for cassandra…"; sleep 3
          done
      - name: wait-for-minio
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z minio.crawler.svc.cluster.local 9000; do
            echo "waiting for minio…"; sleep 3
          done
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis.crawler.svc.cluster.local 6379; do
            echo "waiting for redis…"; sleep 3
          done
      containers:
      - name: crawler
        image: distributed-crawler:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.crawler.svc.cluster.local:9092"
        - name: KAFKA_GROUP_ID
          value: "crawler-group-1"
        - name: CASSANDRA_CONTACT_POINTS
          value: "cassandra.crawler.svc.cluster.local:9042"
        - name: CASSANDRA_LOCAL_DATACENTER
          value: "datacenter1"
        - name: CASSANDRA_KEYSPACE
          value: "crawler"
        - name: S3_ENDPOINT
          value: "http://minio.crawler.svc.cluster.local:9000"
        - name: S3_BUCKET
          value: "crawler-bucket"
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accesskey
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretkey
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75"
        - name: TRUSTED_HOSTS_BACKEND
          value: "redis"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis.crawler.svc.cluster.local"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 4
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
