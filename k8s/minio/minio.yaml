apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: crawler
spec:
  ports:
  - port: 9000
    name: api
  - port: 9001
    name: console
  selector:
    app: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
  namespace: crawler
spec:
  type: NodePort
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30000
    name: api
  - port: 9001
    targetPort: 9001
    nodePort: 30001
    name: console
  selector:
    app: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: crawler
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-01-18T22-51-28Z
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accesskey
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretkey
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-standard
      resources:
        requests:
          storage: 50Gi
---
# Bucket creation is handled by the crawler app itself (BucketBootstrap).
# This Job is a belt-and-braces fallback for operators who want to prime the
# bucket independently — e.g. before running the app for the first time.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: crawler
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-bucket
        image: minio/mc
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accesskey
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretkey
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          until mc alias set myminio http://minio.crawler.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "waiting for minio…"; sleep 3
          done
          mc mb --ignore-existing myminio/crawler-bucket
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: crawler
type: Opaque
stringData:
  accesskey: minioadmin
  secretkey: minioadmin
