spring:
  application:
    name: distributed-crawler

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Optional dependencies — the code degrades gracefully when they're
    # down, so don't let them fail the crawler's readiness probe.
    redis:
      enabled: false

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  info:
    title: "Distributed Web Crawler API"
    description: "REST API for managing the distributed web crawler service"
    version: "1.0.0"
    contact:
      name: "Web Crawler Team"
      url: "https://github.com/your-org/distributed-crawler"
      email: "crawler-team@example.com"

crawler:
  max-depth: 5
  crawl-delay: PT1S
  max-concurrent-requests: 10
  allowed-domains:
    - "example\\.com$"
    - "blog\\.example\\.com$"
    - "httpbin\\.org$"
  exclude-patterns:
    - "/private/.*"
    - "/admin/.*"
  seed-urls:
    - "https://example.com/"
    - "https://httpbin.org/html"
  respect-robots-txt: true
  user-agent: "DistributedCrawler/1.0"
  max-retry-attempts: 3
  enable-delay-retry: true
  batch-size: 10
  poll-timeout: PT5S
  batch-timeout: PT5M
  max-content-bytes: 2097152
  discover-sitemaps: true
  autostart: true
  # Budgets: -1 = unlimited. Use crawl jobs (POST /api/jobs) for finer control.
  max-pages: -1
  max-pages-per-domain: -1
  max-domains: -1

kafka:
  bootstrap-servers: localhost:9092
  group-id: crawler-group-2
  topic: crawler-urls
  page-events-topic: crawler.pages.v1

cassandra:
  contact-points: localhost:30042
  local-datacenter: datacenter1
  keyspace: crawler

s3:
  endpoint: http://localhost:9000
  bucket: crawler-bucket
  access-key-id: minioadmin
  secret-access-key: minioadmin

logging:
  level:
    com.webcrawler: INFO
    org.apache.kafka: WARN
    com.datastax: WARN
